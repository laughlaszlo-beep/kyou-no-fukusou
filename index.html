<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>きょうのふくそう</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #bfdbfe, #ddd6fe, #fef9c3);
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 34px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.16);
      padding: 28px;
    }

    .header {
      text-align: center;
      margin-bottom: 6px;
      padding-top: 6px;
    }

    .search {
      display: flex;
      justify-content: center;
      margin-bottom: 0;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 16px 26px;
      font-size: 18px;
      font-weight: 800;
      color: white;
      background: linear-gradient(180deg, #f59e0b, #ea580c);
      cursor: pointer;
      box-shadow:
        0 10px 20px rgba(234, 88, 12, 0.26),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -2px 0 rgba(0,0,0,0.08);
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        box-shadow 0.15s ease;
      letter-spacing: 0.02em;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.96;
      box-shadow:
        0 14px 28px rgba(234, 88, 12, 0.30),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -2px 0 rgba(0,0,0,0.08);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow:
        0 6px 14px rgba(234, 88, 12, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    button:active {
      transform: translateY(1px);
      box-shadow:
        0 4px 10px rgba(234, 88, 12, 0.20),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .message {
      min-height: 20px;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      margin-bottom: 10px;
    }

    .current {
      display: none;
      margin-bottom: 0;
    }

    .clothing {
      display: none;
      background: linear-gradient(135deg, #60a5fa, #818cf8);
      color: white;
      border-radius: 32px;
      padding: 30px 24px 24px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 16px 36px rgba(79, 70, 229, 0.18);
    }

    .clothing-title {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #eff6ff;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 7px 13px;
      margin-bottom: 20px;
      letter-spacing: 0.01em;
    }

    .clothing-main {
      text-align: center;
      font-size: clamp(52px, 14vw, 82px);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .clothing-note {
      text-align: center;
      margin: 0 auto 18px;
      color: #eff6ff;
      font-size: 16px;
      line-height: 1.7;
      max-width: 420px;
    }

    .sub-info {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .weather,
    .umbrella {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.24);
      color: #f8fafc;
      font-weight: 800;
    }

    .weather {
      font-size: 15px;
    }

    .umbrella-main {
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .umbrella-icon.dim {
      opacity: 0.45;
    }

    .footer {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 32px;
      text-align: center;
      line-height: 1.7;
    }

    .legend {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      margin-top: 0;
      margin-bottom: 32px;
      padding: 10px 14px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.6;
      background: rgba(241,245,249,0.8);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      text-align: left;
    }

    .legend-row {
      display: flex;
      gap: 10px;
      white-space: nowrap;
    }

    .legend-label {
      min-width: 110px;
      font-weight: 700;
    }

    .credit,
    .updated-time {
      opacity: 0.72;
    }

    @media (max-width: 680px) {
      body {
        padding: 18px;
      }

      .app {
        padding: 22px;
        border-radius: 28px;
      }

      .clothing {
        border-radius: 28px;
        padding: 28px 20px 22px;
      }

      .sub-info {
        flex-direction: column;
        align-items: stretch;
      }

      .weather,
      .umbrella {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="search">
        <button id="searchButton" type="button">✨ ふくそう を おしえて</button>
      </div>
    </section>

    <div class="message" id="message"></div>

    <section class="current" id="currentWeather">
      <section class="clothing" id="clothingAdvice">
        <div class="clothing-title" id="todayDate"></div>
        <div class="clothing-main" id="clothingMain"></div>
        <div class="clothing-note" id="clothingNote"></div>
        <div class="sub-info">
          <div class="weather" id="currentDescription"></div>
          <div class="umbrella" id="umbrellaAdvice">
            <div class="umbrella-main" id="umbrellaMain"></div>
          </div>
        </div>
      </section>
    </section>

    <div class="footer">
      <div class="legend">
        <div class="legend-row">
          <span class="legend-label">はんそで</span>
          <span>23℃〜</span>
        </div>
        <div class="legend-row">
          <span class="legend-label">ながそで</span>
          <span>15〜22℃</span>
        </div>
        <div class="legend-row">
          <span class="legend-label">ながそで ＋ うわぎ</span>
          <span>〜14℃</span>
        </div>
      </div>
      <div class="credit">天気データは Open-Meteo の無料APIを使用しています。</div>
      <div class="updated-time" id="footerUpdatedAt"></div>
    </div>
  </main>

  <script>
    const APP_CONFIG = {
      latitude: 38.2682,
      longitude: 140.8694,
      outingStartHour: 8,
      outingEndHour: 16
    };

    const weatherMap = {
      0: ["☀️", "快晴"],
      1: ["🌤️", "晴れ"],
      2: ["⛅", "一部くもり"],
      3: ["☁️", "くもり"],
      45: ["🌫️", "霧"],
      48: ["🌫️", "霧氷"],
      51: ["🌦️", "弱い霧雨"],
      53: ["🌦️", "霧雨"],
      55: ["🌧️", "強い霧雨"],
      61: ["🌦️", "弱い雨"],
      63: ["🌧️", "雨"],
      65: ["🌧️", "強い雨"],
      71: ["🌨️", "弱い雪"],
      73: ["🌨️", "雪"],
      75: ["❄️", "強い雪"],
      80: ["🌦️", "にわか雨"],
      81: ["🌧️", "にわか雨"],
      82: ["⛈️", "強いにわか雨"],
      95: ["⛈️", "雷雨"],
      96: ["⛈️", "雷雨・ひょう"],
      99: ["⛈️", "強い雷雨・ひょう"]
    };

    function getRequiredElement(id) {
      const element = document.getElementById(id);
      if (!element) {
        throw new Error(`必要な画面部品が見つかりません: #${id}`);
      }
      return element;
    }

    function getWeatherInfo(code) {
      return weatherMap[code] || ["🌡️", "不明"];
    }

    function formatDate(dateText) {
      const date = new Date(dateText);
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(date);
    }

    function formatTime(dateText) {
      const date = new Date(dateText);
      return new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function getClothingAdvice(maxTemp) {
      if (maxTemp >= 23) return "はんそで";
      if (maxTemp >= 15) return "ながそで";
      return "ながそで ＋ うわぎ";
    }

    function getClothingNote(maxTemp) {
      if (maxTemp >= 23) return `${maxTemp}℃くらい / あたたかいひです。`;
      if (maxTemp >= 15) return `${maxTemp}℃くらい / すごしやすい きおんです。`;
      return `${maxTemp}℃くらい / うわぎが あると あんしんです。`;
    }

    function getUmbrellaAdvice(hourlyData) {
      const targetHours = hourlyData.time
        .map((time, index) => ({
          hour: new Date(time).getHours(),
          rain: Number(hourlyData.rain[index] || 0),
          probability: Number(hourlyData.precipitation_probability[index] || 0)
        }))
        .filter(item => item.hour >= APP_CONFIG.outingStartHour && item.hour <= APP_CONFIG.outingEndHour);

      if (targetHours.length === 0) {
        return `<span class="umbrella-icon dim">☂️</span> かさ いらない`;
      }

      const maxRain = Math.max(...targetHours.map(item => item.rain));
      const maxProbability = Math.max(...targetHours.map(item => item.probability));
      const hasRainyHour = targetHours.some(item => item.rain > 0 || item.probability >= 50);

      if (maxRain >= 1 || maxProbability >= 40 || hasRainyHour) {
        return "☂️ かさ いる";
      }

      return `<span class="umbrella-icon dim">☂️</span> かさ いらない`;
    }

    async function fetchWeather() {
      const params = new URLSearchParams({
        latitude: APP_CONFIG.latitude,
        longitude: APP_CONFIG.longitude,
        timezone: "auto",
        current: "temperature_2m,weather_code",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        hourly: "rain,precipitation_probability",
        forecast_days: "1"
      });

      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!response.ok) {
        throw new Error("てんきデータを とれませんでした。あとで もういちど ためしてください。");
      }
      return response.json();
    }

    function runTests() {
      console.assert(getClothingAdvice(23) === "はんそで", "23℃以上は、はんそで");
      console.assert(getClothingAdvice(22) === "ながそで", "22℃は、ながそで");
      console.assert(getClothingAdvice(15) === "ながそで", "15℃は、ながそで");
      console.assert(getClothingAdvice(14) === "ながそで ＋ うわぎ", "14℃以下は、ながそで ＋ うわぎ");

      const rainyHourly = {
        time: ["2026-05-11T08:00", "2026-05-11T12:00", "2026-05-11T16:00"],
        rain: [0, 1.2, 0],
        precipitation_probability: [10, 30, 20]
      };
      console.assert(getUmbrellaAdvice(rainyHourly).includes("かさ いる"), "8〜16時に雨量があれば、かさ いる");

      const dryHourly = {
        time: ["2026-05-11T08:00", "2026-05-11T12:00", "2026-05-11T16:00"],
        rain: [0, 0, 0],
        precipitation_probability: [10, 20, 30]
      };
      console.assert(getUmbrellaAdvice(dryHourly).includes("かさ いらない"), "雨量・降水確率が低ければ、かさ いらない");
    }

    function createApp(elements) {
      function renderWeather(data) {
        const current = data.current;
        const [icon, description] = getWeatherInfo(current.weather_code);
        const todayMaxTemp = Math.round(data.daily.temperature_2m_max[0]);

        elements.todayDate.textContent = formatDate(current.time);
        elements.currentDescription.textContent = `${icon} ${description}`;
        elements.footerUpdatedAt.textContent = `最終更新 ${formatTime(current.time)}`;
        elements.clothingMain.textContent = getClothingAdvice(todayMaxTemp);
        elements.clothingNote.textContent = getClothingNote(todayMaxTemp);
        elements.umbrellaMain.innerHTML = getUmbrellaAdvice(data.hourly);

        elements.clothingAdvice.style.display = "block";
        elements.umbrellaAdvice.style.display = "inline-flex";
        elements.currentWeather.style.display = "block";
        elements.message.textContent = "";
      }

      async function handleSearch(event) {
        if (event && typeof event.preventDefault === "function") {
          event.preventDefault();
        }

        elements.searchButton.disabled = true;
        elements.message.textContent = "てんきを よみこんでいます...";
        elements.currentWeather.style.display = "none";
        elements.clothingAdvice.style.display = "none";
        elements.umbrellaAdvice.style.display = "none";

        try {
          const weather = await fetchWeather();
          renderWeather(weather);
        } catch (error) {
          elements.message.textContent = error.message || "エラーが おきました。";
        } finally {
          elements.searchButton.disabled = false;
        }
      }

      elements.searchButton.addEventListener("click", handleSearch);
      handleSearch();
    }

    document.addEventListener("DOMContentLoaded", () => {
      try {
        runTests();

        createApp({
          searchButton: getRequiredElement("searchButton"),
          message: getRequiredElement("message"),
          currentWeather: getRequiredElement("currentWeather"),
          clothingAdvice: getRequiredElement("clothingAdvice"),
          clothingMain: getRequiredElement("clothingMain"),
          clothingNote: getRequiredElement("clothingNote"),
          umbrellaAdvice: getRequiredElement("umbrellaAdvice"),
          umbrellaMain: getRequiredElement("umbrellaMain"),
          todayDate: getRequiredElement("todayDate"),
          currentDescription: getRequiredElement("currentDescription"),
          footerUpdatedAt: getRequiredElement("footerUpdatedAt")
        });
      } catch (error) {
        console.error(error);
        const fallbackMessage = document.getElementById("message");
        if (fallbackMessage) {
          fallbackMessage.textContent = "画面の読み込みでエラーが起きました。";
        }
      }
    });
  </script>
</body>
</html>
